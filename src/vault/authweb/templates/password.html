{% extends "base.html" %}
{% block content %}
<h2>אימות דו־שלבי</h2>
{% include "_error.html" %}
<p>בחשבון שלכם מופעל אימות דו־שלבי. הזינו את סיסמת הענן של טלגרם.</p>
<form method="post" action="/auth/flow/password" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="password">סיסמה</label>
  <input id="password" name="password" type="password" autocomplete="current-password" dir="ltr" required maxlength="256">
  <button type="submit">התחברות</button>
</form>
{% endblock %}
