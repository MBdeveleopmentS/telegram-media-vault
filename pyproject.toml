[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-media-vault"
version = "0.1.0"
description = "Self-hostable Telegram media backup service (photos and videos from selected chats, delivered to your private bot chat)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "telethon==1.45.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "redis==8.1.0",
    "pydantic>=2.13,<2.14",
    "pydantic-settings==2.16.1",
    "cryptography==50.0.2",
    "structlog==26.1.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "fakeredis==2.40.0",
    "aiosqlite==0.22.1",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "httpx==0.28.1",
    "pip-audit",
    "lupa==2.8",
]

[project.scripts]
vault = "vault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vault.authweb" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: requires real Telegram credentials and authorized test accounts (never run in CI)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Hebrew text intentionally contains RTL characters
    "S101",                         # assert is fine in tests (scoped below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "ASYNC109", "ASYNC240", "RUF059", "B007"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["vault"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
